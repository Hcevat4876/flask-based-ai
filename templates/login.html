<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DABI AI</title>
<link rel="icon" type="image/png" href="/favicon.png">
<link rel="apple-touch-icon" href="/favicon.png">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
    --primary: #2563eb;
    --primary-light: #eff6ff;
    --accent: #3b82f6;
    --bg-main: #f8fafc;
    --bg-card: #ffffff;
    --border-color: #e2e8f0;
    --text-main: #1e293b;
    --text-muted: #64748b;
    --shadow-lg: 0 10px 25px -3px rgba(37, 99, 235, 0.1), 0 4px 6px -4px rgba(37, 99, 235, 0.1);
}
body {
  background: var(--bg-main);
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  font-family: 'Plus Jakarta Sans', sans-serif;
  padding: 20px;
}
.card {
  position: relative; z-index: 2;
  background: var(--bg-card);
  border: 1px solid var(--border-color);
  border-radius: 20px; padding: 40px; width: 100%; max-width: 420px;
  box-shadow: var(--shadow-lg);
}
.logo-container {
  display: flex; align-items: center; justify-content: center; gap: 12px; margin-bottom: 8px;
}
.logo-icon {
    width: 44px; height: 44px; border-radius: 12px;
    background: linear-gradient(135deg, var(--primary), var(--accent));
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 18px;
    box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.logo {
  font-size: 22px; font-weight: 700;
  color: var(--text-main); letter-spacing: -0.5px;
}
.sub { text-align: center; color: var(--text-muted); font-size: 11px; font-weight: 500; letter-spacing: 0.5px; margin-bottom: 28px; }
label { display: block; color: var(--text-main); font-size: 12px; font-weight: 600; margin-bottom: 6px; margin-top: 16px; }
input[type="text"], input[type="password"] {
  width: 100%; background: #f8fafc; border: 1px solid var(--border-color);
  border-radius: 12px; padding: 12px 16px; color: var(--text-main);
  font-family: 'Plus Jakarta Sans', sans-serif; font-size: 13.5px; outline: none;
  transition: all 0.3s;
}
input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.12); background: #fff; }
input::placeholder { color: #94a3b8; }

.privacy-container {
  display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; font-size: 12px; color: var(--text-main); font-weight: 500;
}
.privacy-container input[type="checkbox"] {
  margin-top: 2px; cursor: pointer; accent-color: var(--primary); width: 16px; height: 16px;
}
.privacy-container a { color: var(--primary); text-decoration: underline; }

.btn {
  width: 100%; margin-top: 24px; padding: 12px; background: var(--primary);
  border: none; border-radius: 12px;
  color: #fff; font-family: 'Plus Jakarta Sans', sans-serif;
  font-size: 13px; font-weight: 700; letter-spacing: 0.5px;
  cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
}
.btn:hover { background: #1d4ed8; transform: translateY(-1px); }
.link-row { text-align: center; margin-top: 20px; color: var(--text-muted); font-size: 12px; font-weight: 500; }
.link-row a { color: var(--primary); text-decoration: none; font-weight: 600; }
.link-row a:hover { text-decoration: underline; }
.error {
  margin-top: 16px; padding: 10px 14px;
  background: #fee2e2; border: 1px solid #fecaca;
  border-radius: 10px; color: #ef4444; font-size: 12px; font-weight: 500; text-align: center;
}
</style>
</head>
<body>
<div class="card">
  <div class="logo-container">
      <div class="logo-icon"><i class="fas fa-brain"></i></div>
      <div class="logo">DABI AI</div>
  </div>
  <div class="sub">Yapay Zeka Asistanı Oturum Paneli</div>
  <form method="POST">
    <label>Kullanıcı Adı</label>
    <input type="text" name="username" placeholder="Kullanıcı Adı Girin..." autocomplete="username" required>
    <label>Şifre</label>
    <input type="password" name="password" placeholder="Şifre girin..." autocomplete="current-password" required>
    
    <div class="privacy-container">
      <input type="checkbox" id="privacy_agreed" name="privacy_agreed" required>
      <label for="privacy_agreed" style="display:inline; margin:0; font-size:12px; color:var(--text-main); font-weight:500;">
        <a href="/gizlilik.html" target="_blank">Gizlilik Politikası</a>'nı okudum ve kabul ediyorum.
      </label>
    </div>

    <button class="btn" type="submit">GİRİŞ YAP</button>
  </form>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <div class="link-row">Sistemde kayıtlı değil misiniz? <a href="/register">Yeni Profil Oluştur</a></div>
</div>

<script>
    history.pushState(null, null, location.href);
    window.onpopstate = function () {
        history.go(1);
    };
</script>
</body>
</html>
