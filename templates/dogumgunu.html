<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DABI AI - Doğum Günü Müzesi 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f8fafc; color: #1e293b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }
        .museum-container {
            max-width: 800px; width: 100%;
            display: flex; flex-direction: column; gap: 40px;
        }
        .museum-header {
            text-align: center; margin-bottom: 10px;
            animation: fadeInDown 0.6s ease;
        }
        .museum-header h1 {
            font-size: 28px; font-weight: 700; color: #1e293b;
            letter-spacing: -0.5px; margin-bottom: 8px;
        }
        .museum-header p {
            font-size: 14px; color: #64748b; font-weight: 500;
        }

        /* SERGİ KARTI (BÜYÜK VE ZİG-ZAG) */
        .exhibit-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 24px;
            display: flex; align-items: center; gap: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.04), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.5s ease forwards;
        }
        .exhibit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.1);
            border-color: #cbd5e1;
        }

        /* Çift sayılar (Foto 2 ve 4) için sağa yaslama (ters çevirme) */
        .exhibit-card.reverse {
            flex-direction: row-reverse;
        }

        /* BÜYÜK FOTOĞRAF ALANI */
        .exhibit-img-box {
            width: 50%; min-width: 50%; height: 260px;
            background: #f1f5f9; border: 2px dashed #cbd5e1;
            border-radius: 16px; display: flex; align-items: center; justify-content: center;
            overflow: hidden; position: relative;
        }
        
        /* Fotoğraf eklendiğinde tam oturması ve orjinal oranını koruması için */
        .exhibit-img-box img {
            width: 100%; height: 100%; object-fit: contain; background: #0f172a;
        }
        .img-placeholder-text {
            font-size: 12px; color: #94a3b8; font-weight: 600; text-align: center; padding: 20px;
        }

        .exhibit-info {
            width: 50%;
            display: flex; flex-direction: column; gap: 8px;
        }
        .exhibit-tag {
            font-size: 11px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.5px;
        }
        .exhibit-title {
            font-size: 20px; font-weight: 700; color: #1e293b; letter-spacing: -0.5px; line-height: 1.4;
        }

        /* GERİ DÖNÜŞ BUTONU */
        .back-btn-container {
            text-align: center; margin-top: 20px;
        }
        .back-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: #2563eb; color: #fff; text-decoration: none;
            padding: 14px 36px; border-radius: 14px; font-size: 14px; font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .back-btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .back-btn:active { transform: translateY(0); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) {
            .exhibit-card, .exhibit-card.reverse { flex-direction: column; align-items: stretch; }
            .exhibit-img-box { width: 100%; height: 200px; }
            .exhibit-info { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="museum-container">
        <div class="museum-header">
            <h1>🏛️ DABI AI Anı Müzesi</h1>
            <p>Bugün bu özel günde, geçmişten bugüne DABI AI'nin gelişim serüveni.</p>
        </div>

        <!-- Fotoğraf 1 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-box">
                <img src="https://ibb.co/7N4jcD7d" alt="DABI'nin ilk arayüzü">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #1</span>
                <div class="exhibit-title">DABI'nin ilk arayüzü</div>
            </div>
        </div>

        <!-- Fotoğraf 2 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-box">
                <img src="https://ibb.co/b5vsP0R2" alt="DABI'nin ilk Mesajı">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #2</span>
                <div class="exhibit-title">DABI'nin ilk Mesajı</div>
            </div>
        </div>

        <!-- Fotoğraf 3 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-box">
                <img src="https://ibb.co/G4r3Jc0z" alt="DABI'nin Kapatılışı">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #3</span>
                <div class="exhibit-title">DABI'nin Kapatılışı</div>
            </div>
        </div>

        <!-- Fotoğraf 4 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-box">
                <img src="https://ibb.co/FkPpKhX2" alt="DABI'nin Geri dönüşü">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #4</span>
                <div class="exhibit-title">DABI'nin Geri dönüşü</div>
            </div>
        </div>

        <!-- Ana Sayfaya Dönüş Tuşu (Flask kök dizinine yönlendirir ve döngüyü engeller) -->
        <div class="back-btn-container">
            <a href="/" class="back-btn" onclick="sessionStorage.setItem('skip_birthday_redirect', 'true');">
                <i class="fas fa-arrow-left"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
    </div>

    <script>
        window.onload = () => {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        };
    </script>
</body>
</html>
