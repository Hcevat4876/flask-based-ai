<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DABI AI - Doğum Günü Müzesi 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f172a; color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 50px 20px;
        }
        .museum-container {
            max-width: 950px; width: 100%;
            display: flex; flex-direction: column; gap: 40px;
        }
        .museum-header {
            text-align: center; margin-bottom: 20px;
            animation: fadeInDown 0.6s ease;
        }
        .museum-header h1 {
            font-size: 34px; font-weight: 800; color: #f8fafc;
            letter-spacing: -0.5px; margin-bottom: 10px;
            background: linear-gradient(135deg, #38bdf8 0%, #818cf8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .museum-header p {
            font-size: 15px; color: #94a3b8; font-weight: 500;
        }

        /* SERGİ KARTI */
        .exhibit-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 28px;
            overflow: hidden;
            display: flex; align-items: center;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
            animation: fadeInUp 0.5s ease forwards;
        }
        .exhibit-card:hover {
            transform: translateY(-6px);
            border-color: #3b82f6;
            box-shadow: 0 25px 50px -12px rgba(59, 130, 246, 0.25);
        }

        .exhibit-card.reverse {
            flex-direction: row-reverse;
        }

        /* RESİM ÇERÇEVESİ VE DİNAMİK BLUR ARKA PLAN */
        .exhibit-img-wrapper {
            width: 58%; min-width: 58%; height: 340px;
            position: relative; overflow: hidden;
            background: #090d16; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
        }

        /* Arka plandaki blur efektli görsel */
        .exhibit-bg-blur {
            position: absolute; top: -10%; left: -10%; width: 120%; height: 120%;
            background-size: cover; background-position: center;
            filter: blur(25px) brightness(0.4);
            opacity: 0.8;
            transition: transform 0.4s ease;
        }
        .exhibit-img-wrapper:hover .exhibit-bg-blur {
            transform: scale(1.1);
        }

        /* Ana Görsel (Tam Ekrana Sığan, Kırpılmayan) */
        .exhibit-main-img {
            position: relative; z-index: 2;
            max-width: 92%; max-height: 90%;
            object-fit: contain;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease;
        }
        .exhibit-img-wrapper:hover .exhibit-main-img {
            transform: scale(1.03);
        }

        /* Büyüteç İkon İpucu */
        .zoom-hint {
            position: absolute; bottom: 12px; right: 12px; z-index: 3;
            background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(8px);
            color: #93c5fd; padding: 6px 12px; border-radius: 20px;
            font-size: 11px; font-weight: 600; display: flex; align-items: center; gap: 6px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            pointer-events: none;
        }

        /* Yazı Alanı */
        .exhibit-info {
            width: 42%; padding: 36px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .exhibit-tag {
            align-self: flex-start;
            font-size: 11px; font-weight: 700; color: #60a5fa;
            background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3);
            padding: 6px 14px; border-radius: 20px;
            text-transform: uppercase; letter-spacing: 0.8px;
        }
        .exhibit-title {
            font-size: 22px; font-weight: 700; color: #f8fafc;
            letter-spacing: -0.3px; line-height: 1.4;
        }

        /* Geri Dönüş Butonu */
        .back-btn-container {
            text-align: center; margin-top: 20px;
        }
        .back-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            color: #fff; text-decoration: none;
            padding: 16px 42px; border-radius: 16px; font-size: 15px; font-weight: 700;
            box-shadow: 0 10px 25px -5px rgba(37, 99, 235, 0.4);
            transition: all 0.2s ease;
        }
        .back-btn:hover { transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(37, 99, 235, 0.5); }

        /* Modal (Büyük Resim Penceresi) */
        .image-modal {
            display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
            z-index: 9999; align-items: center; justify-content: center;
            padding: 20px; opacity: 0; transition: opacity 0.3s ease;
        }
        .image-modal.active { display: flex; opacity: 1; }
        .modal-content {
            max-width: 90vw; max-height: 85vh;
            object-fit: contain; border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.8);
            border: 1px solid #334155;
        }
        .modal-close {
            position: absolute; top: 25px; right: 25px;
            color: #f8fafc; font-size: 28px; cursor: pointer;
            width: 48px; height: 48px; background: rgba(255,255,255,0.1);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            transition: background 0.2s;
        }
        .modal-close:hover { background: rgba(255,255,255,0.25); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Mobil Uyumluluk */
        @media (max-width: 768px) {
            .exhibit-card, .exhibit-card.reverse { flex-direction: column; }
            .exhibit-img-wrapper { width: 100%; height: 260px; }
            .exhibit-info { width: 100%; padding: 24px; text-align: center; align-items: center; }
        }
    </style>
</head>
<body>

    <div class="museum-container">
        <div class="museum-header">
            <h1>🏛️ DABI AI Anı Müzesi</h1>
            <p>Bugün bu özel günde, geçmişten bugüne DABI AI'nin gelişim serüveni.</p>
        </div>

        <!-- Fotoğraf 1 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-wrapper" onclick="openModal('https://i.ibb.co/wrsBHqDF/Ekran-Resmi-2026-10-12-22-10-47.png')">
                <div class="exhibit-bg-blur" style="background-image: url('https://i.ibb.co/wrsBHqDF/Ekran-Resmi-2026-10-12-22-10-47.png');"></div>
                <img class="exhibit-main-img" src="https://i.ibb.co/wrsBHqDF/Ekran-Resmi-2026-10-12-22-10-47.png" alt="DABI'nin ilk arayüzü">
                <div class="zoom-hint"><i class="fas fa-search-plus"></i> Büyüt</div>
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #1</span>
                <div class="exhibit-title">DABI'nin ilk arayüzü</div>
            </div>
        </div>

        <!-- Fotoğraf 2 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-wrapper" onclick="openModal('https://i.ibb.co/0y9Cc7VF/Ekran-Resmi-2026-10-12-22-13-17.png')">
                <div class="exhibit-bg-blur" style="background-image: url('https://i.ibb.co/0y9Cc7VF/Ekran-Resmi-2026-10-12-22-13-17.png');"></div>
                <img class="exhibit-main-img" src="https://i.ibb.co/0y9Cc7VF/Ekran-Resmi-2026-10-12-22-13-17.png" alt="DABI'nin ilk Mesajı">
                <div class="zoom-hint"><i class="fas fa-search-plus"></i> Büyüt</div>
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #2</span>
                <div class="exhibit-title">DABI'nin ilk Mesajı</div>
            </div>
        </div>

        <!-- Fotoğraf 3 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-wrapper" onclick="openModal('https://i.ibb.co/rRXft4mD/Ekran-Resmi-2026-10-12-22-15-08.png')">
                <div class="exhibit-bg-blur" style="background-image: url('https://i.ibb.co/rRXft4mD/Ekran-Resmi-2026-10-12-22-15-08.png');"></div>
                <img class="exhibit-main-img" src="https://i.ibb.co/rRXft4mD/Ekran-Resmi-2026-10-12-22-15-08.png" alt="DABI'nin Kapatılışı">
                <div class="zoom-hint"><i class="fas fa-search-plus"></i> Büyüt</div>
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #3</span>
                <div class="exhibit-title">DABI'nin Kapatılışı</div>
            </div>
        </div>

        <!-- Fotoğraf 4 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-wrapper" onclick="openModal('https://i.ibb.co/Y4rg3NXm/Ekran-Resmi-2026-10-12-22-16-29.png')">
                <div class="exhibit-bg-blur" style="background-image: url('https://i.ibb.co/Y4rg3NXm/Ekran-Resmi-2026-10-12-22-16-29.png');"></div>
                <img class="exhibit-main-img" src="https://i.ibb.co/Y4rg3NXm/Ekran-Resmi-2026-10-12-22-16-29.png" alt="DABI'nin Geri dönüşü">
                <div class="zoom-hint"><i class="fas fa-search-plus"></i> Büyüt</div>
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #4</span>
                <div class="exhibit-title">DABI'nin Geri dönüşü</div>
            </div>
        </div>

        <!-- Ana Sayfaya Dönüş Tuşu -->
        <div class="back-btn-container">
            <a href="/" class="back-btn" onclick="sessionStorage.setItem('skip_birthday_redirect', 'true');">
                <i class="fas fa-arrow-left"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
    </div>

    <!-- Büyük Resim Modal / Lightbox -->
    <div id="imageModal" class="image-modal" onclick="closeModal()">
        <span class="modal-close">&times;</span>
        <img id="modalImg" class="modal-content" src="" alt="Büyük Görsel">
    </div>

    <script>
        window.onload = () => {
            // Tarih Kontrolü: Bugün 13 Ekim değilse index sayfasına yönlendir
            const today = new Date();
            const currentDay = today.getDate();
            const currentMonth = today.getMonth() + 1; // Ocak = 0 olduğu için +1 ekliyoruz

            if (currentDay !== 13 || currentMonth !== 10) {
                window.location.href = '/';
                return; // Sayfanın geri kalan kodlarının çalışmasını engeller
            }

            // Sadece 13 Ekim'de çalışacak konfeti efekti
            confetti({
                particleCount: 90,
                spread: 80,
                origin: { y: 0.6 }
            });
        };

        function openModal(imgSrc) {
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('modalImg');
            modalImg.src = imgSrc;
            modal.classList.add('active');
        }

        function closeModal() {
            document.getElementById('imageModal').classList.remove('active');
        }
    </script>
</body>
</html>
