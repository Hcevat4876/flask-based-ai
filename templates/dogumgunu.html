<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DABI AI - Doğum Günü Müzesi 🎉</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Konfeti Efekti İçin Kütüphane -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #f8fafc; color: #1e293b;
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 40px 20px;
        }
        .museum-container {
            max-width: 900px; width: 100%;
            display: flex; flex-direction: column; gap: 40px;
        }
        .museum-header {
            text-align: center; margin-bottom: 10px;
            animation: fadeInDown 0.6s ease;
        }
        .museum-header h1 {
            font-size: 32px; font-weight: 700; color: #1e293b;
            letter-spacing: -0.5px; margin-bottom: 8px;
        }
        .museum-header p {
            font-size: 15px; color: #64748b; font-weight: 500;
        }

        /* SERGİ KARTI (BÜYÜK VE ZİG-ZAG) */
        .exhibit-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            overflow: hidden; /* Resmin köşe kavislerini kartın dışına taşırmaması için */
            display: flex; align-items: center;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.02);
            transition: transform 0.2s, box-shadow 0.2s;
            animation: fadeInUp 0.5s ease forwards;
        }
        .exhibit-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 30px -10px rgba(37, 99, 235, 0.12);
            border-color: #cbd5e1;
        }

        /* Çift sayılar (Foto 2 ve 4) için sağa yaslama (ters çevirme) */
        .exhibit-card.reverse {
            flex-direction: row-reverse;
        }

        /* BÜYÜK VE DOLDURULMUŞ FOTOĞRAF ALANI */
        .exhibit-img-box {
            width: 55%; min-width: 55%; height: 380px;
            position: relative;
            background: #f1f5f9;
        }
        
        /* Resmin boşluk kalmadan alanı tam doldurması için */
        .exhibit-img-box img {
            width: 100%; height: 100%;
            object-fit: cover; /* Boşluk bırakmadan alanı tam kaplar */
            object-position: center;
            display: block;
        }

        .exhibit-info {
            width: 45%;
            padding: 40px;
            display: flex; flex-direction: column; gap: 12px;
        }
        .exhibit-tag {
            font-size: 12px; font-weight: 700; color: #2563eb; text-transform: uppercase; letter-spacing: 0.8px;
        }
        .exhibit-title {
            font-size: 24px; font-weight: 700; color: #1e293b; letter-spacing: -0.5px; line-height: 1.3;
        }

        /* GERİ DÖNÜŞ BUTONU */
        .back-btn-container {
            text-align: center; margin-top: 20px;
        }
        .back-btn {
            display: inline-flex; align-items: center; justify-content: center; gap: 10px;
            background: #2563eb; color: #fff; text-decoration: none;
            padding: 16px 40px; border-radius: 16px; font-size: 15px; font-weight: 700;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.25);
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .back-btn:hover { background: #1d4ed8; transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35); }
        .back-btn:active { transform: translateY(0); }

        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-15px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* MOBİL UYUMLULUK */
        @media (max-width: 768px) {
            .exhibit-card, .exhibit-card.reverse { flex-direction: column; }
            .exhibit-img-box { width: 100%; height: 280px; }
            .exhibit-info { width: 100%; padding: 24px; text-align: center; }
        }
    </style>
</head>
<body>

    <div class="museum-container">
        <div class="museum-header">
            <h1>🏛️ DABI AI Anı Müzesi</h1>
            <p>Bugün bu özel günde, geçmişten bugüne DABI AI'nin gelişim serüveni.</p>
        </div>

        <!-- Fotoğraf 1 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-box">
                <img src="https://i.ibb.co/wrsBHqDF/Ekran-Resmi-2026-10-12-22-10-47.png" alt="DABI'nin ilk arayüzü">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #1</span>
                <div class="exhibit-title">DABI'nin ilk arayüzü</div>
            </div>
        </div>

        <!-- Fotoğraf 2 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-box">
                <img src="https://i.ibb.co/0y9Cc7VF/Ekran-Resmi-2026-10-12-22-13-17.png" alt="DABI'nin ilk Mesajı">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #2</span>
                <div class="exhibit-title">DABI'nin ilk Mesajı</div>
            </div>
        </div>

        <!-- Fotoğraf 3 (Solda) -->
        <div class="exhibit-card">
            <div class="exhibit-img-box">
                <img src="https://i.ibb.co/rRXft4mD/Ekran-Resmi-2026-10-12-22-15-08.png" alt="DABI'nin Kapatılışı">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #3</span>
                <div class="exhibit-title">DABI'nin Kapatılışı</div>
            </div>
        </div>

        <!-- Fotoğraf 4 (Sağda) -->
        <div class="exhibit-card reverse">
            <div class="exhibit-img-box">
                <img src="https://i.ibb.co/Y4rg3NXm/Ekran-Resmi-2026-10-12-22-16-29.png" alt="DABI'nin Geri dönüşü">
            </div>
            <div class="exhibit-info">
                <span class="exhibit-tag">Sergi Eseri #4</span>
                <div class="exhibit-title">DABI'nin Geri dönüşü</div>
            </div>
        </div>

        <!-- Ana Sayfaya Dönüş Tuşu -->
        <div class="back-btn-container">
            <a href="/" class="back-btn" onclick="sessionStorage.setItem('skip_birthday_redirect', 'true');">
                <i class="fas fa-arrow-left"></i>
                <span>Ana Sayfaya Dön</span>
            </a>
        </div>
    </div>

    <script>
        window.onload = () => {
            confetti({
                particleCount: 80,
                spread: 70,
                origin: { y: 0.6 }
            });
        };
    </script>
</body>
</html>
